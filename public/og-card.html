<!doctype html>

<head>

<title>FUORI</title>
<style>

  }

  .mark svg { width: 104px; height: 104px; }
  .mark b { font-size: 66px; letter-spacing: 5px; font-weight: 800; }
  h1 { font-size: 76px; line-height: 1.04; text-align: center; font-weight: 800; letter-spacing: -1.5px; }
  h1 em { color: #c8ff2e; font-style: normal; }
  p { margin-top: 30px; font-size: 30px; color: #9d9d9d; text-align: center; max-width: 900px; line-height: 1.4; }
  .url { position: absolute; bottom: 40px; font-size: 20px; color: #6f6f6f; letter-spacing: 1px; }

</head>

  <div class="glow"></div>

      <path d="M96 10 56.8 29.7 70.8 32.1Z" fill="#d7ff3e"/>
      <path d="M96 10 70.8 32.1 71.2 46.3Z" fill="#d7ff3e" fill-opacity=".72"/>
    </svg>
    <b>FUORI</b>
  </div>
  <h1>Sei ancora <em>in tempo.</em></h1>
  <p>Eventi, persone e idee per uscire. In Sicilia, a due passi da dove sei.</p>
