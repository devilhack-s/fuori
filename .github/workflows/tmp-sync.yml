name: tmp-sync
on:
  push:
    paths:
      - '.github/workflows/tmp-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: scarica e scompatta
        run: |
          curl -fsSL -o /tmp/fuori.tar.gz https://fuori.fuori-catania.workers.dev/_sync/672.tar.gz
          tar -xzf /tmp/fuori.tar.gz -C .
      - name: commit
        run: |
          git config user.name 'FUORI sync'
          git config user.email 'sync@fuori.local'
          git add -A
          git commit -m 'sync: fuori v672' || echo 'niente da commitare'
          git push origin HEAD:main
