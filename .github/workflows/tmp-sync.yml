name: tmp-sync
on:
  push:
    paths:
      - '.github/workflows/tmp-sync.yml'
permissions:
  contents: write
jobs:
  sincronizza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica i file
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL -o /tmp/sync.tar.gz "https://fuori.fuori-catania.workers.dev/_sync/sync.tar.gz" && break
            sleep 5
          done
          ls -l /tmp/sync.tar.gz
          tar -xzf /tmp/sync.tar.gz -C .
      - name: Push
        run: |
          git config user.name "fuori-bot"
          git config user.email "fuori-bot@users.noreply.github.com"
          git add -A
          git commit -m "v649: il conteggio delle coccole non si spezza e piu spazio sopra il riquadro"
          git push origin HEAD:main
