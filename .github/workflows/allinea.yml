name: allinea
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  allinea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: scarica e applica
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/p.bin "https://fuori.fuori-catania.workers.dev/_sync/p7k2x9m4v1.bin"
          echo "58b6f6f9436d9dd788d05a92a52d9bb7d239d45bdda0da3bb1866868e0f25edd  /tmp/p.bin" | sha256sum -c -
          rm -rf /tmp/u && mkdir -p /tmp/u
          tar -xzf /tmp/p.bin -C /tmp/u
          cd /tmp/u
          find . -type f -print | sed 's|^\./||' | while read -r f; do
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$f")"
            cp "$f" "$GITHUB_WORKSPACE/$f"
          done
      - name: committa e chiude la staffetta
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git rm -f .github/workflows/allinea.yml
          git config user.name "FUORI staffetta"
          git config user.email "staffetta@users.noreply.github.com"
          git add -A
          git commit -m "Mascotte: bocca, dita e 15 espressioni animate (v638)"
          git push origin HEAD:main
