name: tmp-sync
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-sync.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          curl -fsSL https://fuori.fuori-catania.workers.dev/_sync/643.b64 | base64 -d > /tmp/s.tgz
          tar -xzf /tmp/s.tgz -C .
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "v643: mascotte 5 dita, occhi naturali (no pallini tinta unica)" || echo nothing
          git push origin HEAD:main
