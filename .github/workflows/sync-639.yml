name: sync-639
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-639.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica e applica i file
        run: |
          set -e
          curl -fsSL "https://fuori.fuori-catania.workers.dev/_sync/v639.b64?x=$RANDOM" -o /tmp/p.b64
          base64 -d /tmp/p.b64 > /tmp/p.tgz
          tar -xzf /tmp/p.tgz -C .
          ls -l src/app.js public/app.min.js

      - name: Commit e push
        run: |
          set -e
          git config user.name "FUORI sync"
          git config user.email "christianguarrera@gmail.com"
          git add -A
          git commit -m "Mascotte che ti segue nell'app, pillole con polverina e matrix, domanda Cosa scegli oggi (v639)"
          git rm -q .github/workflows/sync-639.yml
          git commit -m "sync-639: tolgo il workflow temporaneo"
          git push origin HEAD:main
