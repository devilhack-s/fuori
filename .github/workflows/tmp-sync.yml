name: tmp-sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Scarica l'albero dal sito
        run: |
          set -e
          curl -fsSL --retry 6 --retry-delay 5 -o /tmp/sync.tar.gz https://fuori.fuori-catania.workers.dev/_sync/sync.tar.gz
          tar -xzf /tmp/sync.tar.gz -C .
          git status --porcelain | head -20
      - name: Commit e push
        run: |
          set -e
          git config user.name "devilhack-s"
          git config user.email "60830504+devilhack-s@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "niente da sincronizzare"; exit 0; fi
          git commit -m "Pillole lisce: via la polverina puntinata dentro CREA e PARTECIPA (v654)"
          git push origin HEAD:main
