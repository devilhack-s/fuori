<style>
  :root{
    --bg:#0a0a0a; --ink:#f4f4f2; --dim:#9a9a95; --line:#232323; --lime:#c8ff2e;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100svh; padding:32px 24px calc(28px + env(safe-area-inset-bottom));
    position:relative; overflow-x:hidden;
  }
  /* una luce verde soffusa in alto, appena percettibile */
  body::before{
    content:""; position:absolute; top:-38vh; left:50%; transform:translateX(-50%);
    width:min(720px,120vw); height:70vh; border-radius:50%;
    background:radial-gradient(closest-side,rgba(200,255,46,.13),rgba(200,255,46,0));
    pointer-events:none;
  }
  main{width:100%; max-width:440px; position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:0}
  .mark{display:flex; align-items:center; gap:12px; margin-bottom:44px}
  .mark svg{width:34px;height:34px;display:block}
  .mark b{font-size:23px; letter-spacing:.16em; font-weight:800}
  h1{
    font-size:clamp(34px,10vw,44px); line-height:1.04; letter-spacing:-.02em;
    font-weight:800; margin:0 0 16px;
  }
  h1 em{font-style:normal; color:var(--lime)}
  .sub{font-size:16px; line-height:1.5; color:var(--dim); margin:0 0 34px; max-width:33ch}
  .actions{width:100%; display:flex; flex-direction:column; gap:10px}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:56px; padding:0 22px; border-radius:16px;
    font-size:16.5px; font-weight:700; text-decoration:none; letter-spacing:-.01em;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--lime); color:#0a0a0a; box-shadow:0 10px 30px rgba(200,255,46,.18)}
  .btn.primary svg{width:18px;height:18px}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
  .short{margin:8px 0 0; font-size:12px; color:#8a8a84}
  .short b{color:#c8ff2e; font-weight:600}
  .note{margin:22px 0 0; font-size:12.5px; line-height:1.6; color:#6f6f6a; max-width:30ch}
  .dots{display:flex; gap:6px; justify-content:center; margin:26px 0 0}
  .dots i{width:5px;height:5px;border-radius:50%;background:#2b2b2b;display:block}
  footer{
    margin-top:auto; padding-top:44px; font-size:11.5px; color:#5d5d59; text-align:center; line-height:1.6;
  }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M82 54A32 32 0 1 1 50 22" fill="none" stroke="#c8ff2e" stroke-width="9" stroke-linecap="butt"/>
      <path d="M96 10 56.8 29.7 70.8 32.1Z" fill="#c8ff2e"/>
      <path d="M96 10 70.8 32.1 71.2 46.3Z" fill="#c8ff2e" fill-opacity=".72"/>
    </svg>
    <b>FUORI</b>
  </div>

  <h1>Sei ancora<br><em>in tempo.</em></h1>
  <p class="sub">Eventi, persone e idee per uscire. In Sicilia, a due passi da dove sei.</p>

  <div class="actions">
    <a class="btn primary" href="/">
      Apri FUORI
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
    <a class="btn ghost" id="dlBtn" href="https://fuori.fuori-catania.workers.dev/fuori.apk" download="FUORI.apk" rel="nofollow">Scarica per Android</a>
  </div>

  <p class="note">Gratis. Nessuna pubblicità. Sei tu a decidere cosa fare.</p>
  <p class="short">Sito: <b>fuori.fuori-catania.workers.dev</b></p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
</main>

<footer>© 2026 FUORI · Tutti i diritti riservati</footer>
<script>
/* Il tasto scarica prende il file e lo salva con il suo nome:
   così nella barra degli indirizzi non compare nessun indirizzo lungo. */
(function () {
  var btn = document.getElementById("dlBtn");
  if (!btn) return;
  btn.addEventListener("click", function (e) {
    if (!window.fetch || !window.URL || !URL.createObjectURL) return; // nel dubbio, il link fa il suo lavoro
    e.preventDefault();
    btn.textContent = "Un attimo…";
    fetch("/fuori.apk", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("no"); return r.blob(); })
      .then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "FUORI.apk";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        btn.textContent = "Scaricata ✓";
        setTimeout(function () { btn.textContent = "Scarica per Android"; }, 4000);
      })
      .catch(function () { window.location.href = btn.getAttribute("href"); });
  });
})();
</script>
</body>
</html>
