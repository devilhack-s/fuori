name: App Android (APK e Google Play)

# Si avvia da solo quando crei un tag che inizia con "v" (esempio: v1.8),
# oppure a mano da Actions -> "App Android" -> Run workflow.
# I segreti da impostare sono elencati in PUBBLICARE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Canale Google Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      aggiorna_sito:
        description: "Metti il nuovo APK anche sul sito (download diretto)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pubblicazione-android
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Versione presa dal tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "FUORI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "FUORI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          fi

      - name: Prepara la chiave di firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fuori.keystore"
          echo "FUORI_KEYSTORE=$RUNNER_TEMP/fuori.keystore" >> "$GITHUB_ENV"

      - name: Avviso se manca la chiave di firma
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Manca ANDROID_KEYSTORE_BASE64: l'APK esce NON firmato e non si può installare. Vedi PUBBLICARE.md."

      - name: Compila APK e AAB
        env:
          FUORI_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FUORI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FUORI_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle --no-daemon assembleRelease bundleRelease

      - name: File da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: fuori-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Pubblica su Google Play
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.fuori.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Aggiorna fuori.apk sul sito
        if: env.HAS_CLOUDFLARE == 'true' && env.HAS_KEYSTORE == 'true' && (github.event_name == 'push' || github.event.inputs.aggiorna_sito != 'false')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/fuori.apk
          ./build.sh
          npx --yes wrangler@4 deploy
