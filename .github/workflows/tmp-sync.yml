name: tmp-sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: scarica il tar
        run: curl -fsSL https://fuori.fuori-catania.workers.dev/_sync/sync.tar.gz -o /tmp/sync.tar.gz && ls -l /tmp/sync.tar.gz && tar -xzf /tmp/sync.tar.gz -C .
      - name: committa
        run: |
          git config user.name "fuori-bot"
          git config user.email "fuori-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "niente da fare"; else git commit -m "v656: mascotte senza facce sovrapposte e senza ghigno con i denti"; git push origin HEAD:main; fi
