name: Importa aggiornamento una volta

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  importa:
    if: github.repository == 'devilhack-s/fuori'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica e applica l'aggiornamento
        run: |
          set -e
          curl -fsSL "https://fuori-imp-9f3c7a21.fuori-catania.workers.dev/fuori-update.zip" -o "$RUNNER_TEMP/u.zip"
          unzip -o "$RUNNER_TEMP/u.zip" -d .
          git config user.name "FUORI"
          git config user.email "fuori@users.noreply.github.com"
          git add -A
          git commit -m "App iPhone (Capacitor), pubblicazione automatica su Cloudflare/Play/TestFlight e guide"
          git push
