name: tmp-sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica i file aggiornati
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 -o /tmp/sync.tar.gz "https://fuori.fuori-catania.workers.dev/_sync/sync.tar.gz?v=${{ github.run_id }}"; then break; fi
            sleep 6
          done
          tar -xzf /tmp/sync.tar.gz -C .
          git config user.name "devilhack-s"
          git config user.email "christianguerrera@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "La stessa app anche in formato computer: menu in alto, home a due colonne, categorie a griglia (v650)"
          git push origin HEAD:main
