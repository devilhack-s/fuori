name: tmp-sync
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          curl -fsSL https://fuori.fuori-catania.workers.dev/_sync/v642.b64 | base64 -d > /tmp/s.tgz
          tar -xzf /tmp/s.tgz -C .
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "v642: rimosso testo vista dalla linea stato Chi c'e adesso" || echo nothing
          git push origin HEAD:main
